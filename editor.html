<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>サイト編集プレビュー</title><link rel="icon" href="./assets/favicon.svg"><link rel="stylesheet" href="./editor.css"><script src="./site.config.js" defer></script><script src="./editor.js" defer></script></head>
<body class="editor-body">
  <header class="editor-header"><div><strong>サイト編集プレビュー</strong><span>入力すると右側に反映されます</span></div><div class="editor-actions"><button id="import-button">設定を読み込む</button><input type="file" id="import-file" accept=".js,.json" hidden><button id="export-button" class="primary">設定ファイルを保存</button></div></header>
  <div class="editor-layout"><aside class="editor-sidebar"><p class="editor-notice">編集内容は、この画面を開いている間だけ保持されます。<strong>「設定ファイルを保存」</strong>でダウンロードし、同名の <code>site.config.js</code> を置き換えてください。GitHubへアップロードすると公開サイトに反映されます。</p><label class="group-label" for="section-select">編集する項目</label><select id="section-select"><option value="brand">社名・ロゴ・検索表示</option><option value="theme">色・背景画像の色合い</option><option value="home.hero">トップの見出し・画像</option><option value="home.intro">最初の紹介文</option><option value="home.quote">引用カード・写真</option><option value="home.mission">ミッション</option><option value="home.centeredQuote">中央の引用・写真</option><option value="home.story">会社ストーリー</option><option value="home.teamQuote">チーム紹介</option><option value="home.cta">下部の大きなメッセージ</option><option value="home.cards">4つの案内カード</option><option value="news">ニュース・記事本文</option><option value="navigation">メニュー・リンク</option><option value="footer">連絡先・フッター</option><option value="pages">下層ページの本文</option><option value="labels">ボタンなどの表記</option><option value="motion">動きの設定</option><option value="study">デザインサンプルの表記</option><option value="language">ページの言語</option></select><div id="preset-row" hidden><button data-preset="mint">Mint</button><button data-preset="rose">Rose</button><button data-preset="blue">Blue</button><button data-preset="mono">Mono</button></div><form id="fields" autocomplete="off"></form><p class="asset-help">画像は <code>assets</code> フォルダーに置き、<code>./assets/画像名.jpg</code> の形で指定します。人物写真を自社の写真に変えたら「2枚組の仮画像」をオフにしてください。</p><p id="status" role="status" aria-live="polite"></p><a class="guide-link" href="./GUIDE.html" target="_blank">公開・編集の詳しい手順</a></aside>
  <main class="editor-preview"><div class="preview-toolbar"><label for="preview-page">ページ</label><select id="preview-page"><option value="index.html">トップ</option><option value="page.html?view=team">チーム</option><option value="page.html?view=work">事業・サービス</option><option value="page.html?view=partnerships">パートナー</option><option value="page.html?view=culture">カルチャー</option><option value="page.html?view=careers">採用</option><option value="page.html?view=opportunities">募集</option><option value="page.html?view=news">ニュース</option><option value="page.html?view=privacy">プライバシー</option><option value="page.html?view=terms">サンプルの説明</option></select><button id="desktop-button" aria-pressed="true">PC</button><button id="mobile-button" aria-pressed="false">スマホ</button></div><div class="iframe-shell"><iframe id="preview-frame" src="./index.html" title="サイトの変更プレビュー"></iframe></div></main></div>
</body></html>
